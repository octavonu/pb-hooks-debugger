<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Message Board</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💬</text></svg>" />
  <style>
    :root {
      --bg: #f6f4ef;
      --surface: #ffffff;
      --text: #1d1b16;
      --muted: #6b665c;
      --border: #e4dfd4;
      --accent: #d9480f;
      --accent-soft: #fff0e6;
      --shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.04);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #15140f;
        --surface: #1f1d17;
        --text: #f1ede4;
        --muted: #a39d90;
        --border: #34312a;
        --accent: #ff8a4c;
        --accent-soft: #3a2418;
        --shadow: none;
      }
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    main { max-width: 640px; margin: 0 auto; padding: 32px 16px 64px; }
    header h1 { margin: 0; font-size: 1.9rem; letter-spacing: -.02em; }
    header p { margin: 4px 0 0; color: var(--muted); }
    .stats { display: flex; gap: 20px; margin: 16px 0 24px; color: var(--muted); font-size: .9rem; }
    .stats b { color: var(--text); font-variant-numeric: tabular-nums; }
    .live { display: inline-flex; align-items: center; gap: 6px; margin-left: auto; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #9a958a; }
    .dot.on { background: #2f9e44; box-shadow: 0 0 0 3px rgba(47,158,68,.2); }

    form {
      background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
      padding: 16px; box-shadow: var(--shadow); display: grid; gap: 12px;
    }
    input, textarea {
      width: 100%; font: inherit; color: inherit; background: var(--bg);
      border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px;
    }
    input:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
    textarea { resize: vertical; min-height: 80px; }
    .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    .moods { display: flex; gap: 6px; }
    .moods label { cursor: pointer; }
    .moods input { position: absolute; opacity: 0; width: 1px; height: 1px; }
    .moods span {
      display: grid; place-items: center; width: 40px; height: 40px; font-size: 1.3rem;
      border: 1px solid var(--border); border-radius: 10px; background: var(--bg);
    }
    .moods input:checked + span { border-color: var(--accent); background: var(--accent-soft); }
    .moods input:focus-visible + span { outline: 2px solid var(--accent); }
    .counter { color: var(--muted); font-size: .85rem; margin-left: auto; font-variant-numeric: tabular-nums; }
    button.primary {
      font: inherit; font-weight: 600; color: #fff; background: var(--accent);
      border: 0; border-radius: 10px; padding: 10px 18px; cursor: pointer;
    }
    button.primary:disabled { opacity: .6; cursor: default; }
    .error { color: #e03131; font-size: .9rem; min-height: 1.2em; margin: 0; }

    ul { list-style: none; padding: 0; margin: 24px 0 0; display: grid; gap: 12px; }
    li {
      background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
      padding: 14px 16px; box-shadow: var(--shadow); display: grid;
      grid-template-columns: auto 1fr auto; gap: 4px 12px;
    }
    li.new { animation: pop .4s ease-out; }
    @keyframes pop { from { transform: translateY(-6px); opacity: 0; } }
    .mood { font-size: 1.6rem; grid-row: span 2; }
    .meta { font-size: .85rem; color: var(--muted); }
    .meta b { color: var(--text); }
    .body { grid-column: 2 / 4; white-space: pre-wrap; overflow-wrap: anywhere; }
    .like {
      font: inherit; font-size: .9rem; color: var(--muted); background: none;
      border: 1px solid var(--border); border-radius: 999px; padding: 2px 10px; cursor: pointer;
      font-variant-numeric: tabular-nums;
    }
    .like.liked { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
    .empty { text-align: center; color: var(--muted); padding: 32px 0; }
    .more { display: block; margin: 16px auto 0; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>💬 Message Board</h1>
      <p>Leave a thought. Everyone sees it instantly.</p>
    </header>

    <div class="stats">
      <span><b id="s-messages">–</b> messages</span>
      <span><b id="s-authors">–</b> authors</span>
      <span><b id="s-likes">–</b> ❤️</span>
      <span class="live"><span class="dot" id="live-dot"></span><span id="live-text">connecting…</span></span>
    </div>

    <form id="form" autocomplete="off">
      <input id="author" name="author" maxlength="40" placeholder="Your name" required />
      <textarea id="body" name="body" maxlength="280" placeholder="What do you want to say?" required></textarea>
      <div class="row">
        <div class="moods" role="radiogroup" aria-label="Mood">
          <label title="Happy"><input type="radio" name="mood" value="happy" checked /><span>😄</span></label>
          <label title="Love"><input type="radio" name="mood" value="love" /><span>❤️</span></label>
          <label title="Idea"><input type="radio" name="mood" value="idea" /><span>💡</span></label>
          <label title="Party"><input type="radio" name="mood" value="party" /><span>🎉</span></label>
          <label title="Chill"><input type="radio" name="mood" value="chill" /><span>😎</span></label>
        </div>
        <span class="counter" id="counter">0 / 280</span>
        <button class="primary" type="submit" id="submit">Send</button>
      </div>
      <p class="error" id="error" role="alert"></p>
    </form>

    <ul id="list" aria-live="polite"></ul>
    <p class="empty" id="empty" hidden>No messages yet. Be the first!</p>
    <button class="primary more" id="more" hidden>Load more</button>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/pocketbase@0.28.1/dist/pocketbase.umd.js"></script>
  <script>
    const pb = new PocketBase(location.origin)
    pb.autoCancellation(false)

    const MOODS = { happy: '😄', love: '❤️', idea: '💡', party: '🎉', chill: '😎' }
    const PER_PAGE = 20
    const $ = (id) => document.getElementById(id)
    const list = $('list')
    let page = 1

    // Likes and the name are only remembered locally, for convenience.
    const store = {
      get(key, fallback) {
        try { return JSON.parse(localStorage.getItem(key)) ?? fallback } catch { return fallback }
      },
      set(key, value) {
        try { localStorage.setItem(key, JSON.stringify(value)) } catch {}
      },
    }
    const liked = new Set(store.get('liked', []))
    $('author').value = store.get('author', '')

    const timeFmt = new Intl.RelativeTimeFormat('en', { numeric: 'auto' })
    function ago(dateStr) {
      const diff = (new Date(dateStr.replace(' ', 'T')) - Date.now()) / 1000
      const units = [[60, 'second'], [60, 'minute'], [24, 'hour'], [7, 'day'], [4.35, 'week'], [12, 'month'], [Infinity, 'year']]
      let value = diff
      for (const [size, unit] of units) {
        if (Math.abs(value) < size) return timeFmt.format(Math.round(value), unit)
        value /= size
      }
    }

    function render(record, { prepend = false, isNew = false } = {}) {
      let li = document.querySelector(`li[data-id="${record.id}"]`)
      const fresh = !li
      if (fresh) {
        li = document.createElement('li')
        li.dataset.id = record.id
        li.innerHTML = `
          <span class="mood"></span>
          <span class="meta"><b></b> · <time></time></span>
          <button class="like" type="button"></button>
          <span class="body"></span>`
        li.querySelector('.like').addEventListener('click', () => like(record.id))
      }
      li.querySelector('.mood').textContent = MOODS[record.mood] || '💬'
      li.querySelector('.meta b').textContent = record.author
      const time = li.querySelector('time')
      time.dateTime = record.created
      time.textContent = ago(record.created)
      li.querySelector('.body').textContent = record.body
      const btn = li.querySelector('.like')
      btn.textContent = `❤️ ${record.likes || 0}`
      btn.classList.toggle('liked', liked.has(record.id))
      btn.setAttribute('aria-label', `Like this message (${record.likes || 0})`)

      if (fresh) {
        if (isNew) li.classList.add('new')
        prepend ? list.prepend(li) : list.append(li)
      }
      $('empty').hidden = list.children.length > 0
    }

    async function loadPage() {
      const res = await pb.collection('messages').getList(page, PER_PAGE, { sort: '-created' })
      res.items.forEach((r) => render(r))
      $('more').hidden = res.page >= res.totalPages
      $('empty').hidden = list.children.length > 0
    }

    // Ignore stale responses when events arrive in bursts.
    let statsSeq = 0
    async function loadStats() {
      const seq = ++statsSeq
      try {
        const s = await pb.send('/api/board/stats', { method: 'GET' })
        if (seq !== statsSeq) return
        $('s-messages').textContent = s.messages
        $('s-authors').textContent = s.authors
        $('s-likes').textContent = s.likes
      } catch {}
    }

    async function like(id) {
      if (liked.has(id)) return
      liked.add(id)
      store.set('liked', [...liked])
      try {
        await pb.send(`/api/board/like/${id}`, { method: 'POST' })
      } catch {
        liked.delete(id)
        store.set('liked', [...liked])
      }
    }

    $('body').addEventListener('input', (e) => {
      $('counter').textContent = `${e.target.value.length} / 280`
    })

    $('form').addEventListener('submit', async (e) => {
      e.preventDefault()
      const data = Object.fromEntries(new FormData(e.target))
      $('error').textContent = ''
      $('submit').disabled = true
      try {
        await pb.collection('messages').create(data)
        store.set('author', data.author.trim())
        $('body').value = ''
        $('counter').textContent = '0 / 280'
      } catch (err) {
        $('error').textContent = err?.response?.message || 'Could not send the message.'
      } finally {
        $('submit').disabled = false
      }
    })

    $('more').addEventListener('click', () => { page++; loadPage() })

    function setLive(on) {
      $('live-dot').classList.toggle('on', on)
      $('live-text').textContent = on ? 'live' : 'offline'
    }

    async function start() {
      try {
        await loadPage()
      } catch {
        $('error').textContent = 'Could not load messages.'
      }
      loadStats()

      await pb.collection('messages').subscribe('*', (e) => {
        if (e.action === 'create') render(e.record, { prepend: true, isNew: true })
        if (e.action === 'update') render(e.record)
        if (e.action === 'delete') document.querySelector(`li[data-id="${e.record.id}"]`)?.remove()
        loadStats()
      })
      setLive(true)
      pb.realtime.subscribe('PB_CONNECT', () => setLive(true))
      pb.realtime.onDisconnect = () => setLive(false)

      // Refresh relative timestamps.
      setInterval(() => {
        document.querySelectorAll('time').forEach((t) => (t.textContent = ago(t.dateTime)))
      }, 30000)
    }

    start()
  </script>
</body>
</html>
