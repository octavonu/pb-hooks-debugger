<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hooks Debugger</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐞</text></svg>" />
  <style>
    :root {
      --bg: #f5f6f8;
      --surface: #ffffff;
      --surface-2: #eef0f3;
      --text: #1b1f24;
      --muted: #66707c;
      --border: #dde1e6;
      --accent: #2f6fde;
      --accent-soft: #e5eeff;
      --bp: #e03131;
      --paused-bg: #fff4c2;
      --paused-border: #f0b400;
      --ok: #2f9e44;
      --c-kw: #a626a4;
      --c-str: #50a14f;
      --c-num: #b76b01;
      --c-com: #8c939c;
      --c-re: #0184bc;
      --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111317;
        --surface: #181b20;
        --surface-2: #20242b;
        --text: #e6e9ee;
        --muted: #8b95a2;
        --border: #2c313a;
        --accent: #6ea2ff;
        --accent-soft: #1d2a44;
        --bp: #ff6b6b;
        --paused-bg: #3a3214;
        --paused-border: #d9a300;
        --ok: #51cf66;
        --c-kw: #c678dd;
        --c-str: #98c379;
        --c-num: #d19a66;
        --c-com: #6b7480;
        --c-re: #56b6c2;
      }
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { height: 100%; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    button, input, select, textarea { font: inherit; color: inherit; }
    button {
      background: var(--surface-2); border: 1px solid var(--border); border-radius: 7px;
      padding: 5px 11px; cursor: pointer; white-space: nowrap;
    }
    button:hover:not(:disabled) { border-color: var(--accent); }
    button:disabled { opacity: .5; cursor: default; }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
    input, select, textarea {
      background: var(--bg); border: 1px solid var(--border); border-radius: 7px; padding: 6px 9px; min-width: 0;
    }
    input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
    kbd { font-family: var(--mono); font-size: .75em; color: var(--muted); }

    /* Login */
    .login { display: grid; place-items: center; min-height: 100%; padding: 16px; }
    .login form {
      width: 100%; max-width: 360px; background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; padding: 24px; display: grid; gap: 12px;
    }
    .login h1 { margin: 0; font-size: 1.3rem; }
    .login p { margin: 0; color: var(--muted); }
    .err { color: var(--bp); min-height: 1.2em; margin: 0; font-size: .9rem; }

    /* App layout */
    .app { display: grid; grid-template-rows: auto 1fr; height: 100%; }
    header.top {
      display: flex; align-items: center; gap: 12px; padding: 8px 16px;
      background: var(--surface); border-bottom: 1px solid var(--border);
    }
    header.top h1 { font-size: 1rem; margin: 0; }
    .conn { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: .85rem; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
    .dot.on { background: var(--ok); }
    .spacer { flex: 1; }
    .main {
      display: grid; grid-template-columns: var(--left-w, 250px) minmax(0, 1fr) var(--right-w, 380px);
      min-height: 0; position: relative;
    }
    /* Drag handles between the columns */
    .splitter { position: absolute; top: 0; bottom: 0; width: 9px; cursor: col-resize; z-index: 3; touch-action: none; }
    #split-left { left: calc(var(--left-w, 250px) - 5px); }
    #split-right { right: calc(var(--right-w, 380px) - 4px); }
    .splitter::after {
      content: ""; position: absolute; top: 0; bottom: 0; left: 4px; width: 1px; background: transparent; transition: background .15s;
    }
    .splitter:hover::after, .splitter.dragging::after { background: var(--accent); width: 2px; left: 3.5px; }
    body.resizing { cursor: col-resize; user-select: none; }
    body.resizing iframe, body.resizing .code { pointer-events: none; }
    .pane { min-height: 0; overflow: auto; border-right: 1px solid var(--border); }
    .pane:last-child { border-right: 0; }
    .pane h2 {
      font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted);
      margin: 0; padding: 12px 14px 6px;
    }

    /* Small icon buttons (debug bar, pane toolbars) */
    .ib {
      width: 34px; height: 32px; padding: 0; display: inline-grid; place-items: center;
      background: none; border-color: transparent; border-radius: 6px; color: var(--accent);
    }
    .ib svg { width: 20px; height: 20px; }
    .pane-bar .ib { width: 28px; height: 26px; }
    .pane-bar .ib svg { width: 15px; height: 15px; }
    .ib:hover:not(:disabled) { background: var(--surface-2); border-color: var(--border); }
    .ib:disabled { opacity: .3; }
    .ib.go { color: var(--ok); }
    .ib.plain { color: var(--muted); }
    .iconbar { display: flex; align-items: center; gap: 2px; }
    .iconbar .sep { width: 1px; height: 18px; background: var(--border); margin: 0 5px; }

    /* Files (tree) */
    .pane-bar { display: flex; align-items: center; justify-content: space-between; padding: 6px 8px 4px 0; }
    .pane .pane-bar h2 { padding: 0 14px; }
    .tree { padding: 0 6px 12px; font: .85rem var(--mono); }
    .tree .folder {
      width: 100%; text-align: left; background: none; border: 1px solid transparent;
      display: flex; gap: 6px; align-items: center; padding: 3px 8px; font: inherit;
    }
    .tree .folder .tw { width: 10px; color: var(--muted); }
    .ico { width: 14px; height: 14px; flex: none; color: var(--muted); }
    .ico.dir { color: var(--paused-border); }
    .files { list-style: none; margin: 0 0 0 17px; padding: 0 0 0 6px; border-left: 1px dotted var(--border); }
    .files li button {
      width: 100%; text-align: left; background: none; border: 1px solid transparent; padding: 3px 8px;
      display: flex; gap: 6px; align-items: center; font-family: var(--mono); font-size: .85rem;
    }
    .files li button.active { background: var(--accent-soft); border-color: var(--accent); }
    .files .fname { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
    .files .badge { flex: none; }
    .files li button.ro .fname { color: var(--muted); }
    .lock { width: 12px; height: 12px; flex: none; color: var(--muted); }
    .files .lock { margin-left: auto; }
    .badge {
      margin-left: auto; font-family: system-ui, sans-serif; font-size: .68rem; padding: 0 6px;
      border-radius: 999px; background: var(--ok); color: #fff;
    }

    /* Code */
    .code-pane { display: grid; grid-template-rows: auto auto 1fr; background: var(--surface); }
    .tabs { display: flex; overflow-x: auto; background: var(--bg); border-bottom: 1px solid var(--border); }
    .tab {
      display: flex; align-items: center; gap: 6px; padding: 5px 6px 5px 12px; cursor: pointer; white-space: nowrap;
      font: .82rem var(--mono); color: var(--muted); border-right: 1px solid var(--border); border-top: 2px solid transparent;
    }
    .tab:hover { color: var(--text); }
    .tab.active { background: var(--surface); color: var(--text); border-top-color: var(--accent); }
    .tab.paused { border-top-color: var(--paused-border); }
    .tab .tx {
      background: none; border: 0; padding: 0 5px; border-radius: 4px; line-height: 1.3; color: var(--muted); font-size: 1rem;
    }
    .tab .tx:hover { background: var(--surface-2); color: var(--text); }
    .dbg-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); flex: none; }
    .toolbar {
      display: flex; align-items: center; gap: 10px; padding: 8px 12px; flex-wrap: wrap;
      border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--surface); z-index: 1;
    }
    .toolbar .name { font-family: var(--mono); font-weight: 600; }
    .toolbar .hint { color: var(--muted); font-size: .85rem; }
    .code { font: 13px/1.6 var(--mono); padding: 6px 0 40px; overflow: auto; min-height: 0; }
    .ln { display: grid; grid-template-columns: 62px 1fr; white-space: pre; }
    .ln .gut {
      position: relative; text-align: right; padding-right: 14px; color: var(--muted);
      user-select: none; font-variant-numeric: tabular-nums;
    }
    .ln.can .gut { cursor: pointer; }
    .ln.can .gut:hover::before {
      content: ""; position: absolute; left: 8px; top: 50%; width: 10px; height: 10px; margin-top: -5px;
      border-radius: 50%; background: var(--bp); opacity: .35;
    }
    .ln.bp .gut::before {
      content: ""; position: absolute; left: 8px; top: 50%; width: 10px; height: 10px; margin-top: -5px;
      border-radius: 50%; background: var(--bp); opacity: 1;
    }
    .ln.bp .gut { color: var(--bp); }
    .ln .src { padding-right: 16px; }
    .ln.paused { background: var(--paused-bg); box-shadow: inset 3px 0 0 var(--paused-border); }
    .t-kw { color: var(--c-kw); }
    .t-str { color: var(--c-str); }
    .t-num { color: var(--c-num); }
    .t-com { color: var(--c-com); font-style: italic; }
    .t-re { color: var(--c-re); }
    .empty-state { color: var(--muted); padding: 40px 20px; text-align: center; }

    /* Debug panel */
    .panel section { border-bottom: 1px solid var(--border); padding-bottom: 12px; }
    .panel section.dbg-head { padding: 6px 8px 10px; }
    .dbg-head .iconbar { padding-bottom: 6px; border-bottom: 1px solid var(--border); margin-bottom: 8px; }
    .status { padding: 0 6px; }
    .status .where { font-family: var(--mono); font-size: .85rem; margin: 2px 0 0; overflow-wrap: anywhere; }
    .status .state { font-weight: 600; }
    .status .state.paused { color: var(--paused-border); }

    .ptabs { display: flex; padding: 0 8px; border-bottom: 1px solid var(--border); background: var(--surface); }
    .ptab {
      background: none; border: 0; border-bottom: 2px solid transparent; border-radius: 0; padding: 7px 10px;
      color: var(--muted); font-size: .78rem; font-weight: 600; text-transform: uppercase; letter-spacing: .05em;
    }
    .ptab:hover:not(:disabled) { color: var(--text); }
    .ptab.active { color: var(--text); border-bottom-color: var(--accent); }
    .ptab .count { font-weight: 400; color: var(--muted); }
    .ptab-pane { min-height: 140px; max-height: 45vh; overflow: auto; padding: 0 0 10px; border-bottom: 1px solid var(--border); }
    .ptab-pane > .muted, .ptab-pane > .bplist, .ptab-pane > .console { margin-top: 8px; }

    /* Variables tree table */
    .vt { font: 12.5px/1.5 var(--mono); }
    .vt-head, .vt-row { display: grid; grid-template-columns: minmax(90px, 38%) minmax(0, 1fr) 62px; gap: 8px; padding: 2px 14px; }
    .vt-head {
      font: 600 .68rem system-ui, sans-serif; text-transform: uppercase; letter-spacing: .05em; color: var(--muted);
      border-bottom: 1px solid var(--border); padding-top: 6px; position: sticky; top: 0; background: var(--bg);
    }
    .vt-row { border-bottom: 1px solid var(--surface-2); }
    .vt-row.can { cursor: pointer; }
    .vt-row:hover { background: var(--surface-2); }
    .vt-row > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .vt-name { padding-left: calc(var(--d, 0) * 14px); color: var(--accent); }
    .vt-name .tw { display: inline-block; width: 13px; color: var(--muted); }
    .vt-ty { color: var(--muted); font-size: .9em; }
    .vt-row.err .vt-val { color: var(--bp); }
    .vars { padding: 0 14px; font: 12.5px/1.5 var(--mono); }
    .var { border-bottom: 1px dashed var(--border); padding: 3px 0; }
    .var.leaf summary { cursor: default; list-style: none; }
    .var.leaf summary::-webkit-details-marker { display: none; }
    .var summary { cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .var .k { color: var(--accent); }
    .var .ty { color: var(--muted); font-size: .9em; }
    .var pre, .out pre {
      margin: 4px 0 2px; padding: 6px 8px; background: var(--surface-2); border-radius: 6px;
      max-height: 260px; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere;
    }
    .muted { color: var(--muted); }
    .pad { padding: 0 14px; }
    .console { display: grid; gap: 6px; padding: 0 14px; }
    .console .out { font: 12.5px/1.5 var(--mono); max-height: 260px; overflow: auto; }
    .console .out .q { color: var(--muted); }
    .console .out .q::before { content: "› "; }
    .console .out .e { color: var(--bp); white-space: pre-wrap; }
    .console input { font-family: var(--mono); font-size: 12.5px; width: 100%; }
    .bplist { list-style: none; margin: 0; padding: 0 14px; font: 12.5px/1.7 var(--mono); }
    .bplist li { display: flex; gap: 8px; align-items: center; }
    .bplist a { color: inherit; text-decoration: none; cursor: pointer; }
    .bplist a:hover { color: var(--accent); }
    .bplist .x { margin-left: auto; padding: 0 6px; font-size: .8rem; }
    .runner { display: grid; gap: 6px; padding: 0 14px; }
    .runner .row { display: flex; gap: 6px; }
    .runner .row input { flex: 1; font-family: var(--mono); font-size: 12.5px; }
    .runner textarea { font-family: var(--mono); font-size: 12.5px; min-height: 52px; resize: vertical; }
    .runner label { display: flex; gap: 6px; align-items: center; color: var(--muted); font-size: .85rem; }
    .runner .out pre { font: 12px/1.45 var(--mono); }

    .toast {
      position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg);
      padding: 8px 14px; border-radius: 8px; font-size: .9rem; max-width: calc(100% - 32px); z-index: 10;
    }

    @media (max-width: 1100px) {
      .main { grid-template-columns: 200px minmax(0, 1fr); }
      .splitter { display: none; }
      .panel { grid-column: 1 / -1; border-top: 1px solid var(--border); max-height: 50vh; }
      .app { height: auto; min-height: 100%; }
    }
    @media (max-width: 700px) {
      .main { grid-template-columns: 1fr; }
      .pane { border-right: 0; border-bottom: 1px solid var(--border); }
      .files-pane { max-height: 180px; }
      .code { max-height: 60vh; }
      .panel { max-height: none; }
    }
  </style>
</head>
<body>
  <!-- Login -->
  <div class="login" id="login-view" hidden>
    <form id="login-form">
      <h1>🐞 Hooks Debugger</h1>
      <p>Sign in with the instance superuser account.</p>
      <input type="email" id="login-email" placeholder="Email superuser" autocomplete="username" required />
      <input type="password" id="login-password" placeholder="Password" autocomplete="current-password" required />
      <button class="primary" type="submit">Sign in</button>
      <p class="err" id="login-error" role="alert"></p>
    </form>
  </div>

  <!-- App -->
  <div class="app" id="app-view" hidden>
    <header class="top">
      <h1>🐞 Hooks Debugger</h1>
      <span class="conn"><span class="dot" id="conn-dot"></span><span id="conn-text">connecting…</span></span>
      <span class="spacer"></span>
      <span class="muted" id="who"></span>
      <button id="logout">Sign out</button>
    </header>

    <div class="main">
      <aside class="pane files-pane">
        <div class="pane-bar">
          <h2>Files</h2>
          <button class="ib plain" id="btn-refresh" title="Refresh file list">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M13 8a5 5 0 1 1-1.5-3.6"/><path d="M13 2.5v3h-3"/></svg>
          </button>
        </div>
        <div class="tree">
          <button class="folder" id="tree-root" aria-expanded="true">
            <span class="tw">▾</span>
            <svg class="ico dir" viewBox="0 0 16 16" fill="currentColor"><path d="M1.5 3.5A1 1 0 0 1 2.5 2.5h3.6l1.5 1.5h5.9a1 1 0 0 1 1 1v7.5a1 1 0 0 1-1 1h-11a1 1 0 0 1-1-1z"/></svg>
            pb_hooks
          </button>
          <ul class="files" id="files"></ul>
        </div>
      </aside>

      <section class="pane code-pane">
        <div class="tabs" id="tabs" hidden></div>
        <div class="toolbar" id="toolbar" hidden>
          <span class="name" id="file-name"></span>
          <button id="toggle-debug"></button>
          <span class="hint" id="file-hint"></span>
        </div>
        <div class="code" id="code">
          <p class="empty-state">Pick a file on the left.</p>
        </div>
      </section>

      <aside class="pane panel">
        <section class="dbg-head">
          <div class="iconbar" role="toolbar" aria-label="Debugger">
            <button class="ib go" id="btn-continue" disabled title="Resume (F8)" aria-label="Resume">
              <svg viewBox="0 0 16 16" fill="currentColor"><rect x="2" y="3" width="2.4" height="10" rx=".6"/><path d="M6.5 3.2v9.6a.5.5 0 0 0 .77.42l7.1-4.8a.5.5 0 0 0 0-.84l-7.1-4.8a.5.5 0 0 0-.77.42z"/></svg>
            </button>
            <span class="sep"></span>
            <button class="ib" id="btn-into" disabled title="Step Into (F5)" aria-label="Step Into">
              <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8 1.5v7.5M4.8 6.2 8 9.4l3.2-3.2"/><path d="M4 13.5h8" stroke-width="2.2"/></svg>
            </button>
            <button class="ib" id="btn-step" disabled title="Step Over (F6)" aria-label="Step Over">
              <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 9.5a5.5 5.5 0 0 1 10.6-2"/><path d="M13.6 3.9v3.9H9.7"/><path d="M2 13.5h12" stroke-width="2.2"/></svg>
            </button>
            <button class="ib" id="btn-out" disabled title="Step Out (not available yet)" aria-label="Step Out">
              <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2 13.5h6" stroke-width="2.2"/><path d="M11.5 13.5V3M8.3 6.2l3.2-3.2 3.2 3.2"/></svg>
            </button>
            <span class="sep"></span>
            <button class="ib" id="btn-eval" disabled title="Evaluate expression" aria-label="Evaluate expression">
              <svg viewBox="0 0 16 16" fill="currentColor"><text x="8" y="7" text-anchor="middle" font-size="6.6" font-weight="700" font-family="ui-monospace, Menlo, monospace">x+y</text><text x="8" y="14.6" text-anchor="middle" font-size="6.6" font-weight="700" font-family="ui-monospace, Menlo, monospace">=?</text></svg>
            </button>
          </div>
          <div class="status">
            <div class="state" id="state">Running</div>
            <div class="where" id="where">No breakpoint hit.</div>
          </div>
        </section>

        <div class="ptabs" role="tablist">
          <button class="ptab active" data-tab="vars" role="tab">Variables</button>
          <button class="ptab" data-tab="bps" role="tab">Breakpoints <span class="count" id="bp-count"></span></button>
          <button class="ptab" data-tab="eval" role="tab">Evaluate</button>
        </div>
        <div class="ptab-pane" id="pane-vars">
          <div class="vt" id="vars"><p class="muted pad">Shown while execution is paused.</p></div>
        </div>
        <div class="ptab-pane" id="pane-bps" hidden>
          <ul class="bplist" id="bplist"></ul>
        </div>
        <div class="ptab-pane" id="pane-eval" hidden>
          <div class="console">
            <div class="out" id="console-out"></div>
            <input id="console-input" placeholder="e.g. e.record.get('author')" disabled spellcheck="false" />
          </div>
        </div>

        <section>
          <h2>Send a request</h2>
          <div class="runner">
            <div class="row">
              <select id="req-method">
                <option>GET</option><option selected>POST</option><option>PATCH</option><option>DELETE</option>
              </select>
              <input id="req-path" value="/api/collections/messages/records" spellcheck="false" />
            </div>
            <textarea id="req-body" spellcheck="false">{"author":"debug","body":"hello from the debugger","mood":"idea"}</textarea>
            <div class="row">
              <label><input type="checkbox" id="req-auth" /> as superuser</label>
              <span class="spacer"></span>
              <button id="req-send">Send</button>
            </div>
            <div class="out" id="req-out"></div>
          </div>
        </section>
      </aside>

      <div class="splitter" id="split-left" role="separator" aria-orientation="vertical" title="Drag to resize · double-click to reset"></div>
      <div class="splitter" id="split-right" role="separator" aria-orientation="vertical" title="Drag to resize · double-click to reset"></div>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="https://cdn.jsdelivr.net/npm/acorn@8.19.0/dist/acorn.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pocketbase@0.28.1/dist/pocketbase.umd.js"></script>
  <script>
    const pb = new PocketBase(location.origin)
    pb.autoCancellation(false)

    const $ = (id) => document.getElementById(id)
    const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c])
    const PAUSE_MAX_AGE_MS = 5 * 60 * 1000
    const MARKER = '\n// @dbg-instrumented\n'

    const state = {
      files: [],
      file: null,        // { name, source, instrumented }
      analysis: null,    // { probes: Map(line -> probe), tokens }
      breakpoints: [],   // records from dbg_breakpoints
      session: null,     // the currently paused session
      tabs: [],          // names of the files open in editor tabs
      collapsed: new Set(), // folder paths collapsed in the file tree
      expanded: new Set(), // expanded paths in the Variables tree, e.g. "/e/record"
      evalSeq: 0,
      pendingEvals: new Map(),
    }

    let toastTimer
    function toast(msg, ms = 3500) {
      $('toast').textContent = msg
      $('toast').hidden = false
      clearTimeout(toastTimer)
      toastTimer = setTimeout(() => ($('toast').hidden = true), ms)
    }

    function api(path, options = {}) {
      return pb.send(path, options)
    }

    /* ------------------------------------------------------------------ */
    /* Source analysis: which lines can get probes and which vars we see */
    /* ------------------------------------------------------------------ */

    const isFn = (n) => n && /^(FunctionDeclaration|FunctionExpression|ArrowFunctionExpression)$/.test(n.type)

    function childNodes(node) {
      const out = []
      for (const key in node) {
        if (key === 'loc' || key === 'start' || key === 'end' || key === 'type') continue
        const v = node[key]
        if (Array.isArray(v)) v.forEach((x) => x && typeof x.type === 'string' && out.push(x))
        else if (v && typeof v.type === 'string') out.push(v)
      }
      return out
    }

    function patternNames(p, out) {
      if (!p) return out
      if (p.type === 'Identifier') out.push(p.name)
      else if (p.type === 'ObjectPattern') p.properties.forEach((pr) => patternNames(pr.type === 'RestElement' ? pr.argument : pr.value, out))
      else if (p.type === 'ArrayPattern') p.elements.forEach((el) => patternNames(el, out))
      else if (p.type === 'RestElement') patternNames(p.argument, out)
      else if (p.type === 'AssignmentPattern') patternNames(p.left, out)
      return out
    }

    // Names declared in a function (params + body declarations, excluding
    // nested functions). Those not in scope at a given line are dropped on
    // the server (ReferenceError).
    function scopeNames(fn) {
      const names = []
      fn.params.forEach((p) => patternNames(p, names))
      ;(function walk(node) {
        childNodes(node).forEach((child) => {
          if (child.type === 'VariableDeclaration') child.declarations.forEach((d) => patternNames(d.id, names))
          if (child.type === 'FunctionDeclaration' && child.id) { names.push(child.id.name); return }
          if (child.type === 'ClassDeclaration' && child.id) names.push(child.id.name)
          if (child.type === 'CatchClause' && child.param) patternNames(child.param, names)
          if (isFn(child)) return
          walk(child)
        })
      })(fn.body)
      return names
    }

    function describeFn(fn, parent, src) {
      if (parent && parent.type === 'CallExpression' && parent.arguments.includes(fn)) {
        const callee = src.slice(parent.callee.start, parent.callee.end)
        const args = parent.arguments.map((a) =>
          a === fn ? 'ƒ' : a.type === 'Literal' ? JSON.stringify(a.value) : '…')
        return `${callee}(${args.join(', ')})`
      }
      if (fn.id) return `function ${fn.id.name}()`
      if (parent && parent.type === 'VariableDeclarator' && parent.id.type === 'Identifier') return `${parent.id.name}()`
      if (parent && parent.type === 'Property' && parent.key) return `${parent.key.name || parent.key.value}()`
      return 'anonymous function'
    }

    function analyze(src) {
      const ast = acorn.parse(src, {
        ecmaVersion: 'latest', sourceType: 'script', locations: true,
        allowReturnOutsideFunction: true, allowHashBang: true,
      })
      const probes = new Map()

      ;(function visit(node, parent, scopes, ctx) {
        if (isFn(node)) {
          scopes = scopes.concat([scopeNames(node)])
          ctx = describeFn(node, parent, src)
        }
        // Probes only go before statements in blocks inside functions
        // (file-level code runs at startup).
        if (node.type === 'BlockStatement' && scopes.length) {
          node.body.forEach((st) => {
            const line = st.loc.start.line
            if (probes.has(line)) return
            const names = [...new Set(scopes.flat())].filter((n) => /^[\w$]+$/.test(n) && n !== '__dbgx')
            probes.set(line, { line, offset: st.start, names, ctx })
          })
        }
        childNodes(node).forEach((child) => visit(child, node, scopes, ctx))
      })(ast, null, [], null)

      return { probes, classes: tokenClasses(src) }
    }

    // Syntax highlighting based on the acorn tokenizer.
    function tokenClasses(src) {
      const ranges = []
      const tt = acorn.tokTypes
      try {
        const tokenizer = acorn.tokenizer(src, {
          ecmaVersion: 'latest', allowReturnOutsideFunction: true, allowHashBang: true,
          onComment: (block, text, start, end) => ranges.push([start, end, 't-com']),
        })
        for (const tok of tokenizer) {
          let cls = null
          if (tok.type.keyword) cls = 't-kw'
          else if (tok.type === tt.string || tok.type === tt.template) cls = 't-str'
          else if (tok.type === tt.num) cls = 't-num'
          else if (tok.type === tt.regexp) cls = 't-re'
          if (cls) ranges.push([tok.start, tok.end, cls])
        }
      } catch {}
      return ranges.sort((a, b) => a[0] - b[0])
    }

    function instrument(name, src, probes) {
      let out = src
      ;[...probes.values()]
        .sort((a, b) => b.offset - a.offset)
        .forEach((p) => {
          const probe = `/*@dbg*/;require(__hooks+"/_dbg_runtime.js").bp(${JSON.stringify(name)},${p.line},(__dbgx)=>eval(__dbgx),${JSON.stringify(p.names)});/*@/dbg*/`
          out = out.slice(0, p.offset) + probe + out.slice(p.offset)
        })
      return out + MARKER
    }

    /* ------------------------------------------------------------------ */
    /* Rendering                                                           */
    /* ------------------------------------------------------------------ */

    // Files come as paths relative to pb_hooks ("tests/helpers.js"); build a
    // folder tree from them. Folders are listed before files.
    function buildTree(files) {
      const root = { dirs: new Map(), files: [] }
      files.forEach((f) => {
        let node = root
        f.name.split('/').slice(0, -1).forEach((part) => {
          if (!node.dirs.has(part)) node.dirs.set(part, { dirs: new Map(), files: [] })
          node = node.dirs.get(part)
        })
        node.files.push(f)
      })
      return root
    }

    function renderTreeNode(ul, node, prefix) {
      ;[...node.dirs.keys()].sort((a, b) => a.localeCompare(b)).forEach((dir) => {
        const path = prefix + dir
        const open = !state.collapsed.has(path)
        const li = document.createElement('li')
        const btn = document.createElement('button')
        btn.className = 'folder'
        btn.title = path
        btn.setAttribute('aria-expanded', open)
        btn.innerHTML = `<span class="tw">${open ? '▾' : '▸'}</span>${DIR_ICON}<span class="fname">${esc(dir)}</span>`
        btn.addEventListener('click', () => {
          if (open) state.collapsed.add(path)
          else state.collapsed.delete(path)
          renderFiles()
        })
        const sub = document.createElement('ul')
        sub.className = 'files'
        sub.hidden = !open
        renderTreeNode(sub, node.dirs.get(dir), path + '/')
        li.append(btn, sub)
        ul.append(li)
      })
      node.files.forEach((f) => {
        const li = document.createElement('li')
        const btn = document.createElement('button')
        btn.className = [state.file && state.file.name === f.name && 'active', f.readonly && 'ro'].filter(Boolean).join(' ')
        btn.title = f.readonly ? `${f.name} (read-only: part of the debugger)` : f.name
        btn.innerHTML = `${FILE_ICON}<span class="fname">${esc(baseName(f.name))}</span>${f.instrumented ? '<span class="badge">debug</span>' : ''}${f.readonly ? LOCK_ICON : ''}`
        btn.addEventListener('click', () => openFile(f.name))
        li.append(btn)
        ul.append(li)
      })
    }

    function renderFiles() {
      $('files').innerHTML = ''
      renderTreeNode($('files'), buildTree(state.files), '')
      if (!state.files.length) $('files').innerHTML = '<li class="muted pad">No files.</li>'
      renderTabs()
    }

    const baseName = (path) => path.slice(path.lastIndexOf('/') + 1)
    const encodePath = (path) => path.split('/').map(encodeURIComponent).join('/')
    const LOCK_ICON = '<svg class="lock" viewBox="0 0 16 16" fill="currentColor" aria-label="read-only"><path d="M4.5 7V5a3.5 3.5 0 0 1 7 0v2h.5a1 1 0 0 1 1 1v6a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1zm1.6 0h3.8V5a1.9 1.9 0 0 0-3.8 0z"/></svg>'
    const DIR_ICON = '<svg class="ico dir" viewBox="0 0 16 16" fill="currentColor"><path d="M1.5 3.5A1 1 0 0 1 2.5 2.5h3.6l1.5 1.5h5.9a1 1 0 0 1 1 1v7.5a1 1 0 0 1-1 1h-11a1 1 0 0 1-1-1z"/></svg>'
    const FILE_ICON = '<svg class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M3.5 1.5h6l3 3v10h-9z"/><path d="M9.5 1.5v3h3"/></svg>'

    function renderTabs() {
      const bar = $('tabs')
      bar.innerHTML = ''
      bar.hidden = !state.tabs.length
      state.tabs.forEach((name) => {
        const f = state.files.find((x) => x.name === name)
        const tab = document.createElement('div')
        tab.className = ['tab', state.file?.name === name && 'active', state.session?.file === name && 'paused'].filter(Boolean).join(' ')
        tab.title = name + (f?.instrumented ? ' (debug enabled)' : '')
        tab.innerHTML = `${f?.instrumented ? '<span class="dbg-dot"></span>' : ''}${f?.readonly ? LOCK_ICON : ''}<span>${esc(baseName(name))}</span><button class="tx" title="Close" aria-label="Close ${esc(name)}">×</button>`
        tab.addEventListener('click', (e) => {
          if (e.target.closest('.tx')) closeTab(name)
          else if (state.file?.name !== name) openFile(name)
        })
        bar.append(tab)
      })
    }

    function closeTab(name) {
      const i = state.tabs.indexOf(name)
      if (i === -1) return
      state.tabs.splice(i, 1)
      if (state.file?.name === name) {
        const next = state.tabs[Math.min(i, state.tabs.length - 1)]
        if (next) return openFile(next)
        state.file = null
        state.analysis = null
        $('toolbar').hidden = true
        $('code').innerHTML = '<p class="empty-state">Pick a file on the left.</p>'
        renderFiles()
        return
      }
      renderTabs()
    }

    function showPanelTab(id) {
      document.querySelectorAll('.ptab').forEach((b) => {
        b.classList.toggle('active', b.dataset.tab === id)
        b.setAttribute('aria-selected', b.dataset.tab === id)
      })
      document.querySelectorAll('.ptab-pane').forEach((p) => (p.hidden = p.id !== 'pane-' + id))
    }

    function renderCode() {
      const code = $('code')
      if (!state.file) return
      const { source } = state.file
      const { probes, classes } = state.analysis
      const bpLines = new Set(state.breakpoints.filter((b) => b.file === state.file.name).map((b) => b.line))
      const pausedLine = state.session && state.session.file === state.file.name ? state.session.line : null

      // Build the HTML line by line, keeping the classes of tokens that
      // span several lines (block comments, template strings).
      const lines = source.split('\n')
      let pos = 0, ri = 0
      const html = lines.map((text, i) => {
        const lineStart = pos, lineEnd = pos + text.length
        pos = lineEnd + 1
        let out = '', cur = lineStart
        while (ri < classes.length && classes[ri][1] <= lineStart) ri++
        for (let j = ri; j < classes.length && classes[j][0] < lineEnd; j++) {
          const [s, e, cls] = classes[j]
          const a = Math.max(s, lineStart), b = Math.min(e, lineEnd)
          if (a < cur) continue
          out += esc(source.slice(cur, a)) + `<span class="${cls}">${esc(source.slice(a, b))}</span>`
          cur = b
        }
        out += esc(source.slice(cur, lineEnd))
        const n = i + 1
        const cls = ['ln', probes.has(n) && 'can', bpLines.has(n) && 'bp', pausedLine === n && 'paused'].filter(Boolean).join(' ')
        return `<div class="${cls}" data-line="${n}"><span class="gut">${n}</span><span class="src">${out || ' '}</span></div>`
      })
      code.innerHTML = html.join('')

      $('toolbar').hidden = false
      $('file-name').textContent = state.file.name
      const btn = $('toggle-debug')
      btn.disabled = false
      btn.hidden = !!state.file.readonly
      if (state.file.readonly) {
        $('file-hint').textContent = 'Read-only: this file is part of the debugger and cannot be debugged.'
      } else if (state.file.instrumented) {
        btn.textContent = 'Disable debug'
        btn.className = ''
        $('file-hint').textContent = `Probes active on ${probes.size} lines. Click a line number to toggle a breakpoint.`
      } else {
        btn.textContent = 'Enable debug'
        btn.className = 'primary'
        $('file-hint').textContent = probes.size
          ? 'Breakpoints only pause after you enable debug on this file.'
          : 'This file has no code inside functions (handlers) to put breakpoints on.'
      }
    }

    function renderBreakpoints() {
      const list = $('bplist')
      list.innerHTML = ''
      $('bp-count').textContent = state.breakpoints.length ? `(${state.breakpoints.length})` : ''
      if (!state.breakpoints.length) {
        list.innerHTML = '<li class="muted">None. Click a line number.</li>'
        return
      }
      ;[...state.breakpoints]
        .sort((a, b) => a.file.localeCompare(b.file) || a.line - b.line)
        .forEach((bp) => {
          const li = document.createElement('li')
          const active = state.files.find((f) => f.name === bp.file)?.instrumented
          li.innerHTML = `<span style="color:var(--bp)">●</span><a>${esc(bp.file)}:${bp.line}</a>${active ? '' : '<span class="muted">(inactive)</span>'}<button class="x" title="Remove">✕</button>`
          li.querySelector('a').addEventListener('click', () => openFile(bp.file, bp.line))
          li.querySelector('.x').addEventListener('click', () => removeBreakpoint(bp))
          list.append(li)
        })
    }

    function renderValue(name, v) {
      const wrap = document.createElement('details')
      wrap.className = 'var'
      const isComplex = v.value !== null && typeof v.value === 'object'
      const preview = isComplex ? JSON.stringify(v.value) : typeof v.value === 'string' && v.type === 'string' ? JSON.stringify(v.value) : String(v.value)
      wrap.innerHTML = `<summary>${name !== null ? `<span class="k">${esc(name)}</span>: ` : ''}<span class="ty">${esc(v.type)}</span> ${esc(preview.length > 120 ? preview.slice(0, 120) + '…' : preview)}</summary>`
      if (isComplex || preview.length > 120) {
        const pre = document.createElement('pre')
        pre.textContent = isComplex ? JSON.stringify(v.value, null, 2) : preview
        wrap.append(pre)
      } else {
        wrap.classList.add('leaf')
      }
      return wrap
    }

    // Variables as a tree table (Name | Value | Type). Values are the plain
    // JSON snapshots made by the runtime; nested levels expand on click.
    const plainType = (v) => (v === null ? 'null' : Array.isArray(v) ? 'array' : typeof v)

    function previewOf(value, type) {
      if (value === null) return 'null'
      if (Array.isArray(value)) return `Array(${value.length})`
      if (typeof value === 'object') {
        const keys = eventOrder(Object.entries(value)).map(([k]) => k)
        return '{' + keys.slice(0, 5).join(', ') + (keys.length > 5 ? ', …' : '') + '}'
      }
      // Runtime markers like ‹undefined› or ƒ name() are shown as they are.
      if (typeof value === 'string' && type === 'string' && !/^[‹ƒ]/.test(value)) return JSON.stringify(value)
      return String(value)
    }

    // Locals are stored in a JSON field, which sorts keys alphabetically, so
    // the runtime's ordering of hook events is lost. Put the useful fields
    // of an event first again.
    const EVENT_KEYS = ['record', 'collection', 'auth', 'request', 'requestEvent']
    function eventOrder(entries) {
      const keys = entries.map(([k]) => k)
      if (!keys.includes('request') && !keys.includes('requestEvent')) return entries
      const rank = (k) => (EVENT_KEYS.includes(k) ? EVENT_KEYS.indexOf(k) : EVENT_KEYS.length)
      return [...entries].sort((a, b) => rank(a[0]) - rank(b[0]))
    }

    function renderVarRows(container, entries, depth, prefix) {
      entries.forEach(([name, value, type]) => {
        const path = prefix + '/' + name
        const complex = value !== null && typeof value === 'object' && Object.keys(value).length > 0
        const open = complex && state.expanded.has(path)
        const row = document.createElement('div')
        row.className = ['vt-row', complex && 'can', type === 'error' && 'err'].filter(Boolean).join(' ')
        row.style.setProperty('--d', depth)
        if (complex) row.dataset.path = path
        const preview = previewOf(value, type)
        row.innerHTML = `<span class="vt-name"><span class="tw">${complex ? (open ? '▾' : '▸') : ''}</span>${esc(name)}</span><span class="vt-val"></span><span class="vt-ty">${esc(type)}</span>`
        row.querySelector('.vt-val').textContent = preview
        row.querySelector('.vt-val').title = preview
        container.append(row)
        if (open) {
          const children = Array.isArray(value)
            ? value.map((v, i) => [String(i), v, plainType(v)])
            : eventOrder(Object.entries(value)).map(([k, v]) => [k, v, plainType(v)])
          renderVarRows(container, children, depth + 1, path)
        }
      })
    }

    function renderVars() {
      const vars = $('vars')
      const s = state.session
      if (!s) {
        vars.innerHTML = '<p class="muted pad">Shown while execution is paused.</p>'
        return
      }
      const entries = Object.entries(s.locals || {}).map(([k, v]) => [k, v.value, v.type])
      if (!entries.length) {
        vars.innerHTML = '<p class="muted pad">No local variables in scope.</p>'
        return
      }
      const scroll = $('pane-vars').scrollTop
      vars.innerHTML = '<div class="vt-head"><span>Name</span><span>Value</span><span>Type</span></div>'
      renderVarRows(vars, entries, 0, '')
      $('pane-vars').scrollTop = scroll
    }

    function renderSession() {
      const s = state.session
      const paused = !!s
      $('btn-continue').disabled = !paused
      $('btn-step').disabled = !paused
      $('btn-into').disabled = !paused
      $('btn-eval').disabled = !paused
      $('console-input').disabled = !paused
      const atBreakpoint = paused && state.breakpoints.some((b) => b.file === s.file && b.line === s.line)
      $('state').textContent = !paused ? 'Running' : atBreakpoint ? '⏸ Paused at breakpoint' : '⏸ Paused (step)'
      $('state').className = 'state' + (paused ? ' paused' : '')
      renderTabs()
      renderVars()

      if (!paused) {
        $('where').textContent = 'No breakpoint hit.'
        return
      }
      const ctx = state.file && state.file.name === s.file ? state.analysis.probes.get(s.line)?.ctx : null
      $('where').textContent = `${s.file}:${s.line}${ctx ? '  —  ' + ctx : ''}`
    }

    function scrollToLine(line) {
      const el = document.querySelector(`.ln[data-line="${line}"]`)
      if (el) el.scrollIntoView({ block: 'center', behavior: 'smooth' })
    }

    /* ------------------------------------------------------------------ */
    /* Actions                                                            */
    /* ------------------------------------------------------------------ */

    async function loadFiles() {
      state.files = await api('/api/dbg/files')
      renderFiles()
      renderBreakpoints()
    }

    async function loadBreakpoints() {
      state.breakpoints = await pb.collection('dbg_breakpoints').getFullList({ sort: 'file,line' })
      renderBreakpoints()
    }

    async function openFile(name, line) {
      try {
        const file = await api(`/api/dbg/source/${encodePath(name)}`)
        let analysis
        try {
          analysis = analyze(file.source)
          // Debugger files are view-only: no breakable lines.
          if (file.readonly) analysis.probes = new Map()
        } catch (err) {
          state.file = null
          $('toolbar').hidden = true
          $('code').innerHTML = `<p class="empty-state">Cannot parse ${esc(name)}: ${esc(err.message)}</p>`
          return
        }
        state.file = file
        state.analysis = analysis
        if (!state.tabs.includes(name)) state.tabs.push(name)
        renderFiles()
        renderBreakpoints()
        renderCode()
        if (state.session) renderSession()
        if (line) scrollToLine(line)
      } catch (err) {
        toast(err?.response?.message || `Cannot open ${name}`)
      }
    }

    async function toggleBreakpoint(line) {
      if (!state.file || !state.analysis.probes.has(line)) return
      const existing = state.breakpoints.find((b) => b.file === state.file.name && b.line === line)
      try {
        if (existing) {
          await pb.collection('dbg_breakpoints').delete(existing.id)
          state.breakpoints = state.breakpoints.filter((b) => b.id !== existing.id)
        } else {
          const rec = await pb.collection('dbg_breakpoints').create({ file: state.file.name, line })
          state.breakpoints.push(rec)
        }
      } catch (err) {
        toast(err?.response?.message || 'Could not save the breakpoint.')
        await loadBreakpoints()
      }
      renderCode()
      renderBreakpoints()
    }

    async function removeBreakpoint(bp) {
      try {
        await pb.collection('dbg_breakpoints').delete(bp.id)
      } catch {}
      state.breakpoints = state.breakpoints.filter((b) => b.id !== bp.id)
      renderBreakpoints()
      if (state.file) renderCode()
    }

    // Writing to pb_hooks restarts the instance: wait for it to come back.
    async function waitForRestart(name, wantInstrumented) {
      const until = Date.now() + 60000
      // The file changes right away, but hooks reload only after the restart.
      await new Promise((r) => setTimeout(r, 4000))
      while (Date.now() < until) {
        try {
          const files = await api('/api/dbg/files')
          const f = files.find((x) => x.name === name)
          if (f && f.instrumented === wantInstrumented) {
            state.files = files
            return true
          }
        } catch {}
        await new Promise((r) => setTimeout(r, 1500))
      }
      return false
    }

    async function toggleDebug() {
      const file = state.file
      if (!file) return
      const btn = $('toggle-debug')
      btn.disabled = true
      const enabling = !file.instrumented
      $('file-hint').textContent = enabling ? 'Instrumenting and restarting hooks…' : 'Restoring the original…'
      try {
        if (enabling) {
          const source = instrument(file.name, file.source, state.analysis.probes)
          await api(`/api/dbg/instrument/${encodePath(file.name)}`, { method: 'POST', body: { source } })
        } else {
          await api(`/api/dbg/restore/${encodePath(file.name)}`, { method: 'POST' })
        }
        const ok = await waitForRestart(file.name, enabling)
        toast(ok ? (enabling ? `Debug enabled on ${file.name}` : `${file.name} restored`) : 'The instance has not confirmed the change yet. Reload the page.')
      } catch (err) {
        toast(err?.response?.message || 'Operation failed.')
      }
      await openFile(file.name)
    }

    async function sendCommand(command, extra = {}) {
      if (!state.session) return
      try {
        await pb.collection('dbg_sessions').update(state.session.id, { command, ...extra })
      } catch (err) {
        toast(err?.response?.message || 'The command did not reach the server.')
      }
    }

    function consoleLine(html) {
      const out = $('console-out')
      const div = document.createElement('div')
      div.innerHTML = html
      out.append(div)
      out.scrollTop = out.scrollHeight
      return div
    }

    async function evaluate(expr) {
      if (!state.session || !expr.trim()) return
      const seq = ++state.evalSeq
      consoleLine(`<div class="q">${esc(expr)}</div>`)
      const slot = consoleLine('<span class="muted">…</span>')
      state.pendingEvals.set(seq, slot)
      await sendCommand('eval', { expr, evalSeq: seq })
    }

    function onEvalResult(result) {
      const slot = state.pendingEvals.get(result.seq)
      if (!slot) return
      state.pendingEvals.delete(result.seq)
      slot.innerHTML = ''
      if (result.type === 'error') slot.innerHTML = `<span class="e">${esc(result.value)}</span>`
      else slot.append(renderValue(null, result))
    }

    /* ------------------------------------------------------------------ */
    /* Sessions (realtime)                                                */
    /* ------------------------------------------------------------------ */

    async function setPaused(session) {
      state.session = session
      if (!$('pane-bps').hidden) showPanelTab('vars')
      state.evalSeq = Math.max(state.evalSeq, session.evalSeq || 0)
      if (!state.file || state.file.name !== session.file) await openFile(session.file)
      else renderCode()
      renderSession()
      scrollToLine(session.line)
    }

    function clearPaused() {
      state.session = null
      state.pendingEvals.forEach((slot) => (slot.innerHTML = '<span class="muted">cancelled (execution resumed)</span>'))
      state.pendingEvals.clear()
      renderSession()
      if (state.file) renderCode()
    }

    function onSessionEvent(e) {
      const r = e.record
      if (r.status === 'paused') {
        if (r.result && typeof r.result.seq === 'number') onEvalResult(r.result)
        if (!state.session || state.session.id !== r.id || state.session.line !== r.line) setPaused(r)
        else {
          state.session = r
          renderSession()
        }
      } else if (state.session && state.session.id === r.id) {
        if (r.status === 'timeout') toast('Pause timed out; execution resumed.')
        clearPaused()
      }
    }

    async function loadActiveSession() {
      try {
        const list = await pb.collection('dbg_sessions').getList(1, 1, { filter: 'status = "paused"', sort: '-created' })
        const s = list.items[0]
        if (s && Date.now() - new Date(s.updated.replace(' ', 'T')).getTime() < PAUSE_MAX_AGE_MS) await setPaused(s)
      } catch {}
    }

    /* ------------------------------------------------------------------ */
    /* Request runner                                                     */
    /* ------------------------------------------------------------------ */

    async function sendRequest() {
      const method = $('req-method').value
      const path = $('req-path').value.trim()
      const body = $('req-body').value.trim()
      const out = $('req-out')
      out.innerHTML = '<span class="muted">waiting… (if it hits a breakpoint it stays here until you press Continue)</span>'
      const headers = {}
      if (body && method !== 'GET') headers['Content-Type'] = 'application/json'
      if ($('req-auth').checked) headers.Authorization = pb.authStore.token
      const t0 = performance.now()
      try {
        const res = await fetch(new URL(path, location.origin), {
          method, headers, body: method === 'GET' || !body ? undefined : body,
        })
        const text = await res.text()
        let pretty = text
        try { pretty = JSON.stringify(JSON.parse(text), null, 2) } catch {}
        out.innerHTML = `<div class="muted">${res.status} ${esc(res.statusText)} · ${Math.round(performance.now() - t0)} ms</div>`
        const pre = document.createElement('pre')
        pre.textContent = pretty.length > 5000 ? pretty.slice(0, 5000) + '…' : pretty
        out.append(pre)
      } catch (err) {
        out.innerHTML = `<span class="e">${esc(err.message)}</span>`
      }
    }

    /* ------------------------------------------------------------------ */
    /* Startup                                                            */
    /* ------------------------------------------------------------------ */

    /* ------------------------------------------------------------------ */
    /* Resizable columns                                                   */
    /* ------------------------------------------------------------------ */

    const LAYOUT_KEY = 'dbg.layout'
    const DEFAULT_LAYOUT = { left: 250, right: 380 }
    const MIN_LEFT = 150, MIN_RIGHT = 260, MIN_CODE = 320
    let layout = { ...DEFAULT_LAYOUT }
    let layoutReady = false

    function applyLayout(next, save) {
      const main = document.querySelector('.main')
      const total = main.clientWidth
      let { left, right } = next
      if (total) {
        left = Math.max(MIN_LEFT, Math.min(left, total - right - MIN_CODE))
        right = Math.max(MIN_RIGHT, Math.min(right, total - left - MIN_CODE))
      }
      layout = { left: Math.round(left), right: Math.round(right) }
      main.style.setProperty('--left-w', layout.left + 'px')
      main.style.setProperty('--right-w', layout.right + 'px')
      if (save) {
        try { localStorage.setItem(LAYOUT_KEY, JSON.stringify(layout)) } catch {}
      }
    }

    function initSplitter(id, side) {
      const el = $(id)
      el.addEventListener('pointerdown', (e) => {
        if (e.button !== 0) return
        e.preventDefault()
        const rect = document.querySelector('.main').getBoundingClientRect()
        el.setPointerCapture(e.pointerId)
        el.classList.add('dragging')
        document.body.classList.add('resizing')
        const move = (ev) => applyLayout(side === 'left'
          ? { left: ev.clientX - rect.left, right: layout.right }
          : { left: layout.left, right: rect.right - ev.clientX })
        const up = () => {
          el.removeEventListener('pointermove', move)
          el.classList.remove('dragging')
          document.body.classList.remove('resizing')
          applyLayout(layout, true)
        }
        el.addEventListener('pointermove', move)
        el.addEventListener('pointerup', up, { once: true })
        el.addEventListener('pointercancel', up, { once: true })
      })
      el.addEventListener('dblclick', () => applyLayout({ ...layout, [side]: DEFAULT_LAYOUT[side] }, true))
    }

    function initLayout() {
      let saved = null
      try { saved = JSON.parse(localStorage.getItem(LAYOUT_KEY) || 'null') } catch {}
      if (saved && typeof saved.left === 'number' && typeof saved.right === 'number') layout = saved
      applyLayout(layout)
      initSplitter('split-left', 'left')
      initSplitter('split-right', 'right')
      window.addEventListener('resize', () => applyLayout(layout))
    }

    function setConn(on) {
      $('conn-dot').classList.toggle('on', on)
      $('conn-text').textContent = on ? 'live' : 'reconnecting…'
    }

    async function startApp() {
      $('login-view').hidden = true
      $('app-view').hidden = false
      if (!layoutReady) {
        layoutReady = true
        initLayout()
      }
      $('who').textContent = pb.authStore.record?.email || ''
      try {
        await Promise.all([loadFiles(), loadBreakpoints()])
      } catch (err) {
        if (err?.status === 401 || err?.status === 403) return logout('Session expired. Please sign in again.')
        toast('Cannot load files. Are the /api/dbg routes deployed?')
      }
      await pb.collection('dbg_sessions').subscribe('*', onSessionEvent)
      pb.realtime.subscribe('PB_CONNECT', () => setConn(true))
      pb.realtime.onDisconnect = () => setConn(false)
      setConn(true)
      await loadActiveSession()
      const first = state.files.find((f) => !f.readonly) || state.files[0]
      if (!state.file && first) openFile(first.name)
    }

    function logout(msg) {
      pb.realtime.unsubscribe()
      pb.authStore.clear()
      $('app-view').hidden = true
      $('login-view').hidden = false
      $('login-error').textContent = msg || ''
    }

    $('login-form').addEventListener('submit', async (e) => {
      e.preventDefault()
      $('login-error').textContent = ''
      try {
        await pb.collection('_superusers').authWithPassword($('login-email').value, $('login-password').value)
        $('login-password').value = ''
        startApp()
      } catch (err) {
        $('login-error').textContent = err?.response?.message || 'Sign-in failed.'
      }
    })

    $('logout').addEventListener('click', () => logout())
    $('toggle-debug').addEventListener('click', toggleDebug)
    $('code').addEventListener('click', (e) => {
      const gut = e.target.closest('.gut')
      if (gut) toggleBreakpoint(Number(gut.parentElement.dataset.line))
    })
    $('btn-continue').addEventListener('click', () => sendCommand('continue'))
    // The runtime's "step" pauses at the next executed line, which also
    // enters functions in debug-enabled files: that is Step Into. A real
    // Step Over/Out needs call-depth tracking in the runtime (later phase),
    // so for now Step Over behaves the same.
    $('btn-into').addEventListener('click', () => sendCommand('step'))
    $('btn-step').addEventListener('click', () => sendCommand('step'))
    $('btn-eval').addEventListener('click', () => {
      showPanelTab('eval')
      $('console-input').focus()
    })
    document.querySelectorAll('.ptab').forEach((b) => b.addEventListener('click', () => showPanelTab(b.dataset.tab)))
    $('vars').addEventListener('click', (e) => {
      const row = e.target.closest('.vt-row.can')
      if (!row) return
      const path = row.dataset.path
      if (state.expanded.has(path)) state.expanded.delete(path)
      else state.expanded.add(path)
      renderVars()
    })
    $('tree-root').addEventListener('click', () => {
      const open = $('files').hidden
      $('files').hidden = !open
      $('tree-root').setAttribute('aria-expanded', open)
      $('tree-root').querySelector('.tw').textContent = open ? '▾' : '▸'
    })
    $('btn-refresh').addEventListener('click', () => loadFiles().catch(() => toast('Cannot load files.')))
    $('console-input').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        evaluate(e.target.value)
        e.target.value = ''
      }
    })
    $('req-send').addEventListener('click', sendRequest)
    document.addEventListener('keydown', (e) => {
      if (!state.session) return
      if (e.key === 'F8') { e.preventDefault(); sendCommand('continue') }
      if (e.key === 'F5' || e.key === 'F6') { e.preventDefault(); sendCommand('step') }
    })

    if (pb.authStore.isValid && pb.authStore.isSuperuser) startApp()
    else $('login-view').hidden = false
  </script>
</body>
</html>
